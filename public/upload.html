<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đóng góp — AgentSkills</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body class="bg-slate-50 text-slate-900 antialiased" data-require-auth>

  <!-- ============ NAVBAR ============ -->
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center gap-4">
      <a href="index.html" class="flex items-center gap-2 shrink-0">
        <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 grid place-items-center text-white font-black text-lg">A</span>
        <span class="font-extrabold text-lg tracking-tight">Agent<span class="text-indigo-600">Skills</span></span>
      </a>
      <nav class="flex items-center gap-2 ml-auto">
        <a href="index.html" data-i18n="nav.explore" class="px-3 py-2 text-sm font-medium text-slate-600 hover:text-slate-900 rounded-lg hover:bg-slate-100 transition-colors">Khám phá</a>
        <div id="langToggle" class="flex items-center rounded-lg border border-slate-200 overflow-hidden text-xs font-bold select-none">
          <button data-lang="vi" class="px-2.5 py-1.5 transition-colors">VI</button>
          <button data-lang="en" class="px-2.5 py-1.5 transition-colors">EN</button>
        </div>
        <div id="navAuth" class="flex items-center gap-1 ml-1"></div>
      </nav>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-10">
    <div class="mb-8">
      <h1 data-i18n="u.title" class="text-3xl font-extrabold tracking-tight">Đóng góp lên AgentSkills</h1>
      <p data-i18n="u.subtitle" class="text-slate-500 mt-2">Chia sẻ một hướng dẫn đơn lẻ hoặc cả một bộ collection cho cộng đồng.</p>
    </div>

    <!-- ===== Step 1: choose type ===== -->
    <section class="mb-8">
      <label data-i18n="u.step1" class="block text-sm font-semibold text-slate-700 mb-3">1. Bạn muốn đăng gì?</label>
      <div class="grid sm:grid-cols-2 gap-4">
        <button type="button" data-pick="skill" class="type-card text-left p-5 rounded-2xl border-2 border-indigo-500 bg-indigo-50/50 transition-all">
          <div class="flex items-center justify-between">
            <span class="w-10 h-10 rounded-xl bg-indigo-100 text-indigo-600 grid place-items-center">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </span>
            <span data-check class="w-5 h-5 rounded-full bg-indigo-600 grid place-items-center text-white text-xs">✓</span>
          </div>
          <h3 data-i18n="u.cardSkillT" class="font-bold mt-3">Skill / Hướng dẫn</h3>
          <p data-i18n="u.cardSkillD" class="text-sm text-slate-500 mt-1">Một file đơn (.md, .xml, .pdf, .docx...)</p>
        </button>

        <button type="button" data-pick="collection" class="type-card text-left p-5 rounded-2xl border-2 border-slate-200 bg-white hover:border-slate-300 transition-all">
          <div class="flex items-center justify-between">
            <span class="w-10 h-10 rounded-xl bg-violet-100 text-violet-600 grid place-items-center">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            </span>
            <span data-check class="w-5 h-5 rounded-full bg-slate-200 grid place-items-center text-white text-xs opacity-0">✓</span>
          </div>
          <h3 data-i18n="u.cardColT" class="font-bold mt-3">Collection</h3>
          <p data-i18n="u.cardColD" class="text-sm text-slate-500 mt-1">Cả bộ gồm nhiều file hướng dẫn & cấu hình</p>
        </button>
      </div>
    </section>

    <!-- ===== Step 2: dropzone ===== -->
    <section class="mb-8">
      <label class="block text-sm font-semibold text-slate-700 mb-3"><span data-i18n="u.step2">2. Tải file lên</span> <span id="fileHint" class="font-normal text-slate-400"></span></label>
      <div id="dropzone" class="dropzone border-2 border-dashed border-slate-300 rounded-2xl p-10 text-center bg-white cursor-pointer hover:border-indigo-400 hover:bg-indigo-50/30 transition-all">
        <span class="mx-auto w-14 h-14 rounded-2xl bg-indigo-50 text-indigo-500 grid place-items-center mb-4">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </span>
        <p data-i18n-html="u.dzTitle" class="font-semibold text-slate-700"></p>
        <p data-i18n="u.dzSub" class="text-xs text-slate-400 mt-1"></p>
        <input id="fileInput" type="file" multiple class="hidden" accept=".md,.xml,.pdf,.doc,.docx,.txt,.json,.zip" />
      </div>
      <ul id="fileList" class="mt-3 space-y-2"></ul>
    </section>

    <!-- ===== Step 3: metadata ===== -->
    <section class="mb-8 space-y-5">
      <label data-i18n="u.step3" class="block text-sm font-semibold text-slate-700">3. Thông tin chi tiết</label>

      <div>
        <label data-i18n="u.fTitle" class="block text-xs font-medium text-slate-500 mb-1.5">Tiêu đề</label>
        <input id="titleInput" data-i18n-ph="u.fTitlePh" type="text" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 outline-none text-sm transition-all" />
      </div>

      <div>
        <label data-i18n="u.fDesc" class="block text-xs font-medium text-slate-500 mb-1.5">Mô tả ngắn</label>
        <textarea id="descInput" data-i18n-ph="u.fDescPh" rows="3" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 outline-none text-sm resize-none transition-all"></textarea>
      </div>

      <div class="grid sm:grid-cols-3 gap-4">
        <div>
          <label data-i18n="u.fCat" class="block text-xs font-medium text-slate-500 mb-1.5">Danh mục</label>
          <select id="catSelect" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-300 outline-none text-sm bg-white cursor-pointer transition-all"></select>
        </div>
        <div>
          <label data-i18n="u.fLang" class="block text-xs font-medium text-slate-500 mb-1.5">Ngôn ngữ của skill</label>
          <select id="skillLangSelect" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-300 outline-none text-sm bg-white cursor-pointer transition-all"></select>
        </div>
        <div>
          <label data-i18n="u.fLicense" class="block text-xs font-medium text-slate-500 mb-1.5">License</label>
          <select id="licenseSelect" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-300 outline-none text-sm bg-white cursor-pointer transition-all">
            <option>MIT</option><option>Apache-2.0</option><option>CC-BY-4.0</option><option>BSD-3</option><option>Khác / Other</option>
          </select>
        </div>
      </div>

      <div id="newCatBlock" class="hidden grid sm:grid-cols-2 gap-4 p-4 rounded-xl bg-indigo-50/40 border border-indigo-100">
        <div>
          <label data-i18n="u.newCatVi" class="block text-xs font-medium text-slate-500 mb-1.5">Tên danh mục (Tiếng Việt)</label>
          <input id="newCatVi" type="text" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 outline-none text-sm transition-all" />
        </div>
        <div>
          <label data-i18n="u.newCatEn" class="block text-xs font-medium text-slate-500 mb-1.5">Tên danh mục (English)</label>
          <input id="newCatEn" type="text" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 outline-none text-sm transition-all" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1.5"><span data-i18n="u.fTags">Tags</span> <span data-i18n="u.fTagsNote" class="text-slate-400">(phân cách bằng dấu phẩy)</span></label>
        <input id="tagsInput" data-i18n-ph="u.fTagsPh" type="text" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 outline-none text-sm transition-all" />
      </div>
    </section>

    <!-- ===== Submit ===== -->
    <div class="flex items-center justify-between gap-4 pt-2 border-t border-slate-200">
      <a href="index.html" data-i18n="u.cancel" class="text-sm text-slate-500 hover:text-slate-700">← Huỷ</a>
      <button id="submitBtn" class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-sm shadow-indigo-200 transition-colors" data-i18n="u.submit">Đăng lên AgentSkills</button>
    </div>
  </main>

  <footer id="siteFooter" class="border-t border-slate-200 bg-white mt-12"></footer>

  <script src="assets/app.js"></script>
  <script src="assets/auth.js"></script>
  <script>
    // ---- type picker ----
    let pickType = "skill";
    function updateHint() {
      document.getElementById("fileHint").textContent = pickType === "collection" ? t("u.hintN") : t("u.hint1");
    }
    document.querySelectorAll("[data-pick]").forEach((card) => {
      card.addEventListener("click", () => {
        pickType = card.dataset.pick;
        document.querySelectorAll("[data-pick]").forEach((c) => {
          const active = c === card;
          c.classList.toggle("border-indigo-500", active);
          c.classList.toggle("bg-indigo-50/50", active);
          c.classList.toggle("border-slate-200", !active);
          c.classList.toggle("bg-white", !active);
          const chk = c.querySelector("[data-check]");
          chk.classList.toggle("opacity-0", !active);
          chk.classList.toggle("bg-indigo-600", active);
          chk.classList.toggle("bg-slate-200", !active);
        });
        updateHint();
        document.getElementById("fileInput").multiple = pickType === "collection";
      });
    });

    // ---- populate selects that depend on language ----
    function toggleNewCat() {
      const isOther = document.getElementById("catSelect").value === "__other__";
      document.getElementById("newCatBlock").classList.toggle("hidden", !isOther);
    }
    function populateSelects() {
      const cat = document.getElementById("catSelect");
      const prevCat = cat.value;
      cat.innerHTML = CATEGORIES.filter((c) => c.id !== "all")
        .map((c) => `<option value="${c.id}">${c[LANG]}</option>`).join("")
        + `<option value="__other__">${t("u.catOther")}</option>`;
      if (prevCat) cat.value = prevCat;
      toggleNewCat();

      const sl = document.getElementById("skillLangSelect");
      const prevSL = sl.value;
      sl.innerHTML = Object.keys(LANGS)
        .map((code) => `<option value="${code}">${LANGS[code].flag} ${LANGS[code][LANG]}</option>`).join("");
      if (prevSL) sl.value = prevSL;
    }
    document.getElementById("catSelect").addEventListener("change", toggleNewCat);

    // react to language switch (event dispatched from app.js)
    document.addEventListener("i18n:changed", () => { updateHint(); populateSelects(); });

    // initial fill — pull categories from the server first
    loadCategories().then(populateSelects);
    updateHint();

    const FMT_BY_EXT = { md: "MD", markdown: "MD", xml: "XML", pdf: "PDF", doc: "DOCX", docx: "DOCX", json: "JSON", txt: "TXT", zip: "ZIP" };
    function detectFormat() {
      if (!files.length) return "MD";
      const ext = (files[0].name.split(".").pop() || "").toLowerCase();
      return FMT_BY_EXT[ext] || "MD";
    }
    async function submitSkill() {
      if (!window.CURRENT_USER) { alert(t("u.needLogin")); location.href = "login.html?next=upload.html"; return; }
      const title = document.getElementById("titleInput").value.trim();
      if (!title) { alert(t("u.fTitle")); return; }
      const category = document.getElementById("catSelect").value;
      if (category === "__other__" && (!document.getElementById("newCatVi").value.trim() || !document.getElementById("newCatEn").value.trim())) {
        alert(t("u.newCatVi") + " / " + t("u.newCatEn")); return;
      }
      const payload = {
        type: pickType,
        title,
        description: document.getElementById("descInput").value.trim(),
        category,
        newCatVi: document.getElementById("newCatVi").value.trim(),
        newCatEn: document.getElementById("newCatEn").value.trim(),
        lang: document.getElementById("skillLangSelect").value,
        license: document.getElementById("licenseSelect").value,
        tags: document.getElementById("tagsInput").value,
        format: detectFormat(),
        files: files.map((f) => ({ name: f.name, type: (FMT_BY_EXT[(f.name.split(".").pop() || "").toLowerCase()] || "FILE"), size: fmtSize(f.size) })),
      };
      const r = await fetch("/api/skills", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const d = await r.json();
      if (r.ok) { alert(t("u.success")); location.href = "detail.html?id=" + d.skill.id; }
      else alert(d.error || "Error");
    }
    document.getElementById("submitBtn").addEventListener("click", submitSkill);

    // ---- dropzone ----
    const dz = document.getElementById("dropzone");
    const input = document.getElementById("fileInput");
    const list = document.getElementById("fileList");
    let files = [];
    const fmtSize = (b) => (b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : (b / 1024).toFixed(0) + " KB");
    const ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4 text-slate-400"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';

    function render() {
      list.innerHTML = files.map((f, i) => `
        <li class="flex items-center justify-between gap-3 px-4 py-2.5 bg-white border border-slate-200 rounded-xl">
          <span class="flex items-center gap-2 min-w-0">${ICON}<span class="text-sm font-medium text-slate-700 truncate">${f.name}</span></span>
          <span class="flex items-center gap-3 shrink-0">
            <span class="text-xs text-slate-400">${fmtSize(f.size)}</span>
            <button onclick="removeFile(${i})" class="text-slate-300 hover:text-rose-500 transition-colors">✕</button>
          </span>
        </li>`).join("");
    }
    window.removeFile = (i) => { files.splice(i, 1); render(); };
    function addFiles(fl) {
      const arr = Array.from(fl);
      files = pickType === "collection" ? files.concat(arr) : [arr[0]].filter(Boolean);
      render();
    }
    dz.addEventListener("click", () => input.click());
    input.addEventListener("change", (e) => addFiles(e.target.files));
    ["dragenter", "dragover"].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add("dragover"); }));
    ["dragleave", "drop"].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove("dragover"); }));
    dz.addEventListener("drop", (e) => addFiles(e.dataTransfer.files));
  </script>
</body>
</html>
