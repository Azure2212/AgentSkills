<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — AgentSkills</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body class="bg-slate-50 text-slate-900 antialiased">

  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center gap-4">
      <a href="index.html" class="flex items-center gap-2 shrink-0">
        <span class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 grid place-items-center text-white font-black text-lg">A</span>
        <span class="font-extrabold text-lg tracking-tight">Agent<span class="text-indigo-600">Skills</span></span>
      </a>
      <nav class="flex items-center gap-2 ml-auto">
        <div id="langToggle" class="flex items-center rounded-lg border border-slate-200 overflow-hidden text-xs font-bold select-none">
          <button data-lang="vi" class="px-2.5 py-1.5 transition-colors">VI</button>
          <button data-lang="en" class="px-2.5 py-1.5 transition-colors">EN</button>
        </div>
        <div id="navAuth" class="flex items-center gap-1 ml-1"></div>
      </nav>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 py-12">
    <div class="bg-white border border-slate-200 rounded-2xl p-8 shadow-sm shadow-slate-200/50">
      <h1 data-i18n="login.title" class="text-2xl font-extrabold tracking-tight">Đăng nhập</h1>
      <p data-i18n="login.sub" class="text-slate-500 text-sm mt-1">Chào mừng trở lại AgentSkills.</p>

      <div id="err" class="hidden mt-4 px-4 py-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-600 text-sm"></div>

      <div class="mt-6 space-y-4">
        <div>
          <label data-i18n="login.username" class="block text-xs font-medium text-slate-500 mb-1.5">Tên đăng nhập</label>
          <input id="u" type="text" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 outline-none text-sm transition-all" />
        </div>
        <div>
          <label data-i18n="login.password" class="block text-xs font-medium text-slate-500 mb-1.5">Mật khẩu</label>
          <input id="p" type="password" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-300 focus:ring-2 focus:ring-indigo-100 outline-none text-sm transition-all" />
        </div>
        <button id="loginBtn" data-i18n="login.submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm shadow-sm shadow-indigo-200 transition-colors">Đăng nhập</button>
      </div>

      <p class="text-center text-sm text-slate-500 mt-4">
        <span data-i18n="login.noAcc">Chưa có tài khoản?</span>
        <a href="register.html" data-i18n="login.toRegister" class="text-indigo-600 font-semibold hover:underline">Đăng ký ngay</a>
      </p>

      <div class="flex items-center gap-3 my-6">
        <div class="flex-1 h-px bg-slate-200"></div>
        <span data-i18n="login.or" class="text-xs text-slate-400">hoặc tiếp tục với</span>
        <div class="flex-1 h-px bg-slate-200"></div>
      </div>

      <div class="grid grid-cols-3 gap-3">
        <button onclick="social('google')" class="flex items-center justify-center gap-2 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-sm font-semibold transition-colors"><span class="text-base font-black text-[#4285F4]">G</span> Google</button>
        <button onclick="social('facebook')" class="flex items-center justify-center gap-2 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-sm font-semibold transition-colors"><span class="text-base font-black text-[#1877F2]">f</span> Facebook</button>
        <button onclick="social('github')" class="flex items-center justify-center gap-2 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-sm font-semibold transition-colors">
          <svg viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.5v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.7.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.8 18.3 5 18.3 5c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.3c0 .3.2.6.8.5 4.6-1.5 7.9-5.8 7.9-10.9C23.5 5.7 18.3.5 12 .5z"/></svg>
          GitHub
        </button>
      </div>
      <p class="text-center text-[11px] text-slate-400 mt-3">⚠️ Social login mô phỏng (prototype) — sẽ thay bằng OAuth thật sau.</p>
    </div>

    <div class="text-center text-xs text-slate-400 mt-6">Demo admin: <b class="text-slate-600">Azure</b> / <b class="text-slate-600">123</b></div>
  </main>

  <footer id="siteFooter" class="border-t border-slate-200 bg-white mt-12"></footer>

  <script src="assets/app.js"></script>
  <script src="assets/auth.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const next = params.get("next") || "index.html";
    const errBox = document.getElementById("err");
    function showErr(m) { errBox.textContent = m || "Error"; errBox.classList.remove("hidden"); }
    const val = (id) => document.getElementById(id).value.trim();

    async function doLogin() {
      errBox.classList.add("hidden");
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: val("u"), password: document.getElementById("p").value }) });
      const d = await r.json();
      if (r.ok) location.href = next; else showErr(d.error);
    }
    async function social(provider) {
      const ident = prompt(t("login.oauthPrompt") + " (" + provider + ")", "");
      if (!ident) return;
      const r = await fetch("/api/oauth", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ provider, identifier: ident }) });
      const d = await r.json();
      if (r.ok) location.href = next; else showErr(d.error);
    }
    document.getElementById("loginBtn").addEventListener("click", doLogin);
    document.getElementById("p").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
  </script>
</body>
</html>
